# devices/cupid/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device cupid
	title       Xiaomi 12
	vendor      Xiaomi
	soc         sm8450
	defconfig   cupid_defconfig
	maintainer  HACKIOS (Xiaomi 12 cupid port)
	status      display     missing   not started: needs the cupidPkg UEFI platform and its vendor display driver
	status      touch       missing   not started: the panel's controller is a STMicroelectronics FTS on SPI4, not the GOODIX of the reference phone
	status      buttons     missing   not started
	status      cpu         missing   not started: this SoC's EPSS is 0x17d91000, the driver's is the SC7280's 0x18591000
	status      gpu         missing   not started: Adreno 730, the driver is written for the Adreno 642L
	status      storage     missing   not started: UFS, the same controller as the reference phone
	status      audio       missing   not started: the audio DSP, as the reference phone
	status      battery     missing   not started
	status      haptic      missing   not started
	status      camera      missing   not started
	status      torch       missing   not started
	status      wifi        missing   not started: QCA6490, the driver is written for the WCN6750
	status      bluetooth   missing   not started: QCA6490 on UART20
	status      cellular    missing   not started: the modem's addresses are in soc.args
	status      thermal     missing   not started: the sensor table is this phone's own (tools/dt-thermal.py)
