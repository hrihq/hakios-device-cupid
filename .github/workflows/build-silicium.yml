name: build-silicium-cupid

# Follow the manual's fastboot boot path with HakiOS's Silicium UEFI, not U-Boot.
# Waipio findings from the working mayfly port: payload at 0xB0000000, header v4,
# and the image size covering the payload. The FD comes from the pinned CI run.
# A green run means an image was packed; it is not a boot test.

on:
  workflow_dispatch:
    inputs:
      fd_run:
        description: "GitHub Actions run whose cupid-uefi-binaries artifact holds the FD (empty = the pinned default)"
        required: false
        default: ""
        type: string
      fd_mode:
        description: "FD build target the artifact was built with (RELEASE or DEBUG)"
        required: false
        default: RELEASE
        type: choice
        options: [RELEASE, DEBUG]
      shim_diag:
        description: "BootShim diagnostic define (e.g. -DCUPID_SHIM_BEACON: paints the splash buffer and resets; empty = normal image)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  COMMON_REV: 63fc2b4633bac3af8e57dadab9f5a8d4cb940438
  HAKIOS_UEFI_REV: 1c6522893266157506c767e2ca427053ed3634a8
  KERNEL_RUN: 44295839504
  FD_RUN: 44304797702
  DEVICE: cupid

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the device repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld make patch python3 python3-pip curl git unzip
          clang --version | head -1

      - name: Clone the common repository and the UEFI helpers
        run: |
          set -euo pipefail
          git init -q common
          git -C common remote add origin https://github.com/oosexgang/hakios-xnu-kernel.git
          git -C common fetch --depth 1 origin "$COMMON_REV"
          git -C common checkout -q FETCH_HEAD
          rm -rf common/devices/cupid
          ln -s "$GITHUB_WORKSPACE" common/devices/cupid
          git init -q hakios-uefi
          git -C hakios-uefi remote add origin https://github.com/oosexgang/hakios-uefi.git
          git -C hakios-uefi fetch --depth 1 origin "$HAKIOS_UEFI_REV"
          git -C hakios-uefi checkout -q FETCH_HEAD
          echo "common at $(git -C common rev-parse HEAD)"

      - name: Download the pinned artifacts
        run: |
          FD_RUN="${{ inputs.fd_run || env.FD_RUN }}"
          export FD_RUN
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, zipfile
          T = os.environ["GH_TOKEN"]
          os.makedirs("artifacts", exist_ok=True)
          base = "https://api.github.com/repos/hrihq/hakios-device-cupid/actions/runs"
          def dl(run, name, out):
              arts = json.loads(subprocess.check_output([
                  "curl", "-sSL", "-H", "Authorization: Bearer " + T,
                  f"{base}/{run}/artifacts"], text=True))["artifacts"]
              a = next(x for x in arts if x["name"] == name)
              z = out + ".zip"
              subprocess.check_call(["curl", "-sSL", "-H", "Authorization: Bearer " + T, "-o", z, a["archive_download_url"]])
              with zipfile.ZipFile(z) as f:
                  f.extractall(out)
              print(name, "->", out)
          dl(int(os.environ["KERNEL_RUN"]), "cupid-kernel", "artifacts/kernel")
          dl(int(os.environ["FD_RUN"]), "cupid-uefi-binaries", "artifacts/fd")
          PY
          find artifacts -type f | sort

      - name: Assemble a minimal Mu-Silicium tree for the packer
        run: |
          set -euo pipefail
          M=common/Mu-Silicium
          mkdir -p "$M/BootShim" "$M/Build/cupidPkg/RELEASE_CLANGPDB/FV" \
                   "$M/Resources/DTBs" "$M/Resources/Scripts"
          curl -fsSL -o "$M/BootShim/BootShim.S" \
            https://raw.githubusercontent.com/Project-Silicium/Mu-Silicium/e51cd877e31c8fbb322032dc4cb6715e83d25ad3/BootShim/BootShim.S
          curl -fsSL -o "$M/BootShim/Makefile" \
            https://raw.githubusercontent.com/Project-Silicium/Mu-Silicium/e51cd877e31c8fbb322032dc4cb6715e83d25ad3/BootShim/Makefile
          fd=$(find artifacts/fd -name SILICIUM_UEFI.fd -print -quit)
          [ -s "$fd" ] || { echo "::error ::no FD in the artifact"; exit 1; }
          MODE="${{ inputs.fd_mode || 'RELEASE' }}"
          mkdir -p "$M/Build/cupidPkg/${MODE}_CLANGPDB/FV"
          cp "$fd" "$M/Build/cupidPkg/${MODE}_CLANGPDB/FV/SILICIUM_UEFI.fd"
          cp uefi/files/Resources/DTBs/cupid.dtb "$M/Resources/DTBs/cupid.dtb"
          curl -fsSL -o "$M/Resources/Scripts/mkbootimg.py" \
            https://raw.githubusercontent.com/oosexgang/hakios-sm7325/af52dfba33f91340bde68dbbe238ae583f9fd472/prebuilt/mkbootimg.py
          # HakiOS's hakios.patch adds the "XNUP" payload copy to BootShim.S (guarded by
          # #ifdef PAYLOAD_BASE). The raw upstream file has no such loop, so without it the
          # payload is never moved to PAYLOAD_BASE and the firmware finds nothing at 0xB0000000.
          # The one hunk is carried here instead of relying on the pinned hakios-uefi revision,
          # whose patch is applied only to the full tree in build-uefi.yml.
          ( cd "$M" && patch -p1 --forward --batch -i "$GITHUB_WORKSPACE/uefi/bootshim-payload-copy.patch" )
          [ "$(grep -c 'PAYLOAD_BASE' "$M/BootShim/BootShim.S")" = 2 ]
          # Bring-up diagnostic, off unless shim_diag defines it: proves the shim ran without a serial port.
          ( cd "$M" && patch -p1 --forward --batch -i "$GITHUB_WORKSPACE/uefi/bootshim-diagnostic.patch" )
          printf 'H' > "$M/Resources/ramdisk"
          cp tools/mkxnuimg-cupid.py common/mkxnuimg.py
          ls -l "$M/Build/cupidPkg/${MODE}_CLANGPDB/FV/SILICIUM_UEFI.fd"

      - name: Check the payload base is consistent
        run: |
          set -euo pipefail
          python3 tools/payload-base-check.py --self-test
          python3 tools/payload-base-check.py

      - name: Pack the payload and the boot image
        working-directory: common
        env:
          SHIM_CFLAGS: ${{ inputs.shim_diag }}
        run: |
          set -euo pipefail
          python3 xnuloader/mkpayload.py --usb -o payload.bin \
            loader.efi=../artifacts/kernel/cupid-loader.efi \
            kernel=../artifacts/kernel/cupid-kernel \
            ramdisk=prebuilt/userland/hello --cmdline=-v
          python3 mkxnuimg.py -d cupid --mode "${{ inputs.fd_mode || 'RELEASE' }}" -p payload.bin -o xnu-cupid.img
          sha256sum xnu-cupid.img

      - name: Verify the shim places the payload at the waipio base
        working-directory: common
        env:
          FD_MODE: ${{ inputs.fd_mode || 'RELEASE' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, struct, zlib
          img = pathlib.Path('xnu-cupid.img').read_bytes()
          size = struct.unpack_from('<I', img, 8)[0]
          d = zlib.decompressobj(16 + zlib.MAX_WBITS)
          blob = d.decompress(img[4096:4096 + size])
          import os
          fd = pathlib.Path('Mu-Silicium/Build/cupidPkg/%s_CLANGPDB/FV/SILICIUM_UEFI.fd' % os.environ.get('FD_MODE', 'RELEASE')).read_bytes()
          shim = blob[:blob.find(fd)]
          want = (0xD2800000 | (0xB000 << 5) | (1 << 21) | 5).to_bytes(4, 'little')  # movz x5, #0xb000, lsl #16
          assert want in shim, 'the shim has no payload copy to 0xB0000000: hakios.patch was not applied'
          assert blob.find(fd) + len(fd) + 4 <= len(blob) and blob[blob.find(fd) + len(fd):blob.find(fd) + len(fd) + 4] == b'XNUP', 'no XNUP payload after the FD'
          print(f'shim {len(shim)} bytes, payload copy to 0xB0000000 present, XNUP payload present')
          PY

      - name: Upload the image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cupid-silicium-img
          path: common/xnu-cupid.img
          if-no-files-found: error
          retention-days: 30

      - name: Report
        if: always()
        run: |
          echo "## cupid Silicium image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- common: \`$COMMON_REV\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- payload base: \`0xB0000000\`, header v4" >> "$GITHUB_STEP_SUMMARY"
          echo "A packed image is not a boot test. Use \`fastboot boot\` only." >> "$GITHUB_STEP_SUMMARY"
