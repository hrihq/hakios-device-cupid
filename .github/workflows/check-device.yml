name: check-device-cupid

# The device repository's own checks, on every push and pull request:
#   1. the GPU facts still match the phone's device tree (tools/gpu-facts.py --check)
#   2. the device repository holds together in the common repository's tooling
#      (tools/hakios-device.py check cupid, tools/drivers-check.py)
#
# Neither needs a phone. Both are source checks; neither says anything about booting.

on:
  push:
    branches: [main, adreno-730-cupid]
    paths: ["**", "!uefi/**", "!.github/workflows/build-uefi.yml"]
  pull_request:
    paths: ["**", "!uefi/**", "!.github/workflows/build-uefi.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Linux's A7XX register dumps, pinned so the check is reproducible
  LINUX_REV: 067c5c24cef23d913b67eaaf71ae67e7169a6620

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the device repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Check the GPU facts against the device tree
        run: |
          set -euo pipefail
          python3 tools/gpu-facts.py \
            --dtb uefi/files/Resources/DTBs/cupid.dtb \
            --check docs/gpu-facts.txt

      - name: Fetch Linux's A7XX register dumps at the pinned revision
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/linux-registers"
          mkdir -p "$dir"
          base="https://raw.githubusercontent.com/torvalds/linux/$LINUX_REV/drivers/gpu/drm/msm/registers/adreno"
          for f in a6xx.xml a6xx_gmu.xml adreno_common.xml; do
            curl -fsSL "$base/$f" -o "$dir/$f"
            echo "$f $(wc -c < "$dir/$f") bytes"
          done
          echo "dir=$dir" >> "$GITHUB_ENV"

      - name: Check the Adreno 730 address layer
        run: |
          set -euo pipefail
          python3 tools/gpu-address-check.py \
            --config gpu/a730_resources.json \
            --dtb uefi/files/Resources/DTBs/cupid.dtb \
            --linux "$dir" \
            --check-header gpu/hakios.adreno-a730.h

      - name: Run the address layer tests
        run: |
          set -euo pipefail
          python3 tools/gpu-address-tests.py

      - name: Check the firmware tooling against its own fixtures
        run: |
          set -euo pipefail
          python3 tools/gpu-firmware-check.py --self-test

      - name: Check the UEFI platform's vendor-binary references
        run: |
          set -euo pipefail
          python3 tools/uefi-build-check.py --self-test
          python3 tools/uefi-build-check.py | tail -n 1

      - name: Check the device facts against the device tree
        run: |
          set -euo pipefail
          python3 tools/device-facts.py \
            --dtb uefi/files/Resources/DTBs/cupid.dtb \
            --check docs/device-facts.txt

      - name: Check the UEFI tooling against its own fixtures
        run: |
          set -euo pipefail
          python3 tools/uefi-fv-unpack.py --self-test
          python3 tools/uefi-binaries-check.py \
            --manifest uefi/firmware/vendor-binaries.json --self-test

      - name: Check the device blocker report matches the generator
        run: |
          set -euo pipefail
          python3 tools/device-blockers.py --check docs/device-blockers.json

      - name: Check the blocker report matches the configuration
        run: |
          set -euo pipefail
          python3 tools/gpu-blocker-report.py --check docs/gpu-blockers.json

      - name: Checkout the common repository
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git common
          # the device repository is devices/<name> of the common tree; a link keeps a single copy
          rm -rf common/devices/cupid
          ln -s "$GITHUB_WORKSPACE" common/devices/cupid
          ls -l common/devices/cupid

      - name: Check the driver compatibility matrix against the drivers
        run: |
          set -euo pipefail
          python3 tools/driver-matrix-check.py             --common common             --matrix docs/driver-compatibility.md

      - name: Check the device repository holds together
        run: |
          set -euo pipefail
          cd common
          python3 tools/hakios-device.py check cupid
          python3 tools/drivers-check.py
          echo "::notice ::The device repository is consistent. This says nothing about booting on a phone."
