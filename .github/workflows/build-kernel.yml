name: build-kernel-cupid

# Build the XNU kernel for the Xiaomi 12 from the common repository at a pinned revision, with this
# device repository linked in as devices/cupid. A green run means the kernel links; it is not a boot
# test. The first boot can use the common repository's prebuilt kernel instead (docs/port-pkg110.md).

on:
  workflow_dispatch:
    inputs:
      payload_base:
        description: "Address where the loader/payload is placed (hex literal)"
        required: false
        default: "0xB0000000ULL"
        type: string
  push:
    branches: [adreno-730-cupid]
    paths:
      - "configs/**"
      - "soc/**"
      - "device.conf"
      - "soc.args"
      - "metal.args"
      - ".github/workflows/build-kernel.yml"

permissions:
  contents: read

env:
  COMMON_REV: 63fc2b4633bac3af8e57dadab9f5a8d4cb940438

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout the device repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Check disk space
        run: |
          set -euo pipefail
          free_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Free space on /: ${free_gb} GB"
          [ "$free_gb" -ge 16 ] || { echo "::error ::Need at least 16 GB for XNU and its dependencies"; exit 1; }

      - name: Install the host toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils unzip make \
            clang llvm lld flex bison m4 perl python3 python3-pip \
            autoconf automake libtool libtool-bin pkg-config rsync cpio \
            zlib1g-dev libssl-dev libxml2-dev uuid-dev libncurses-dev libtirpc-dev gawk bc file patch
          echo "apt: done"

      - name: Install theos with its Linux toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS"
          [ -x "$THEOS/toolchain/linux/iphone/bin/ld" ] || { echo "::error ::theos cctools missing"; exit 1; }
          find "$THEOS/sdks" -maxdepth 2 -name "iPhoneOS16.5.sdk" -print -quit | grep -q . \
            || { echo "::error ::iPhoneOS16.5.sdk missing"; exit 1; }

      - name: Clone the common repository and link this device
        run: |
          set -euo pipefail
          git init -q common
          git -C common remote add origin https://github.com/oosexgang/hakios-xnu-kernel.git
          git -C common fetch --depth 1 origin "$COMMON_REV"
          git -C common checkout -q FETCH_HEAD
          rm -rf common/devices/cupid
          ln -s "$GITHUB_WORKSPACE" common/devices/cupid
          echo "common at $(git -C common rev-parse HEAD)"
          # The loader reads XNU from PAYLOAD_BASE directly, so the value must be compiled in.
          # A #ifndef plus LOADER_CFLAGS did not take effect: sed never matched the source line,
          # and the loader kept 0xF0000000 (inside the trusted apps carve-out on this SoC).
          # Rewrite the define itself and make the build fail if it did not stick.
          sed -i -E "s/^[[:space:]]*#define[[:space:]]+PAYLOAD_BASE[[:space:]]+.*/#define PAYLOAD_BASE ${{ inputs.payload_base || '0xB0000000ULL' }}/" common/xnuloader/loader.c
          grep -n "define PAYLOAD_BASE" common/xnuloader/loader.c
          grep -q "PAYLOAD_BASE.*${{ inputs.payload_base || '0xB0000000ULL' }}" common/xnuloader/loader.c || { echo "::error ::PAYLOAD_BASE was not rewritten"; exit 1; }
          # The loader only recognized redwood's framebuffer; on cupid it fell back to the QEMU
          # platform (wrong GIC/UART) and froze right after the banner. Give it a real cupid platform.
          ( cd common && patch -p1 --forward --batch -i "$GITHUB_WORKSPACE/kernel/cupid-platform.patch" )
          grep -n "platform_cupid" common/xnuloader/loader.c | head -3
          ( cd common && patch -p1 --forward --batch -i "$GITHUB_WORKSPACE/kernel/no-debug-session.patch" )
          grep -n "debug-enabled" common/xnuloader/loader.c | head -2
          # The stock resident reserve (768 MiB) demands a memory window > 896 MiB; cupid's largest
          # free block is ~738-864 MiB, so every resident root was rejected and the phone reset.
          ( cd common && patch -p1 --forward --batch -i "$GITHUB_WORKSPACE/kernel/resident-window.patch" )
          grep -q "RESIDENT_RD_RESERVE 0x10000000ULL" common/xnuloader/loader.c || { echo "::error::resident-window patch did not apply"; exit 1; }

      - name: Configure for cupid
        working-directory: common
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          make cupid_defconfig
          make config

      - name: Fetch and build the kernel dependencies
        working-directory: common
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          xnu-deps/setup.sh --stage1

      - name: Apply HakiOS's work to Apple's XNU
        working-directory: common
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          [ -d xnu-src/xnu-8796.121.2 ] || xnu/apply.sh
          xnu-deps/setup.sh --stage2 || { cat xnu-deps/exporthdrs.log 2>/dev/null || true; exit 1; }

      - name: Build XNU
        working-directory: common
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          tools/make-kernel.sh -j4 2>&1 | tee kernel-build.log

      - name: Build the loader with a placeholder identity
        working-directory: common
        run: |
          set -euo pipefail
          # no IPSW here: this loader can boot the open kernel with an Apple-free ramdisk, not Darwin
          xnuloader/mkidentity.sh --placeholder
          LOADER_CFLAGS="-DPAYLOAD_BASE=${{ inputs.payload_base || '0xB0000000ULL' }}" xnuloader/build.sh
          cp xnuloader/loader.efi "$GITHUB_WORKSPACE/cupid-loader.efi"
          sha256sum "$GITHUB_WORKSPACE/cupid-loader.efi"

      - name: Build the small userland (root.apfs)
        working-directory: common
        run: |
          set -euo pipefail
          # A first boot needs a real root filesystem: "hello" is only a 16 KiB test program.
          # root.apfs carries init, etc/rc and the launchd jobs as the second ramdisk (resident).
          export PATH="$PWD/xnu-deps/host/bin:$PATH"
          export THEOS="$HOME/theos"
          cd userland
          # rc.darwin runs a few Darwin programs and halts instead of handing process 1 to
          # launchd, so a failed launch does not reboot the phone before the log can be read.
          RC=rc.darwin ./build.sh
          ls -l root.apfs
          cp root.apfs "$GITHUB_WORKSPACE/root.apfs"

      - name: Upload the kernel
        if: success()
        run: |
          set -euo pipefail
          K=common/xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          [ -s "$K" ] || { echo "::error ::no kernel at $K"; exit 1; }
          cp "$K" cupid-kernel
          sha256sum cupid-kernel

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cupid-kernel
          path: |
            cupid-kernel
            cupid-loader.efi
            common/kernel-build.log
            root.apfs
          if-no-files-found: error

      - name: Report
        if: always()
        run: |
          echo "## cupid kernel" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- common repository: \`$COMMON_REV\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- a linked kernel is not a boot test; no phone was used" >> "$GITHUB_STEP_SUMMARY"
